name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build React Bundle
        run: |
          cd web
          npm ci
          npm run build
      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  build-desktop-apps:
    needs: build-frontend
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Vortex-Downloader-Windows-x64.exe
            asset_name: Vortex-Downloader-Windows-x64.exe
          - os: macos-latest
            artifact_name: dist/Vortex-Downloader
            asset_name: Vortex-Downloader-macOS-x64
          - os: ubuntu-latest
            artifact_name: dist/Vortex-Downloader
            asset_name: Vortex-Downloader-Linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywebview pyinstaller

      - name: Build Desktop Executable with PyInstaller
        run: |
          pyinstaller vortex.spec

      - name: Move Output Binary
        shell: python
        run: |
          import os, shutil, sys
          is_win = sys.platform == 'win32'
          src = os.path.join('dist', 'Vortex-Downloader.exe' if is_win else 'Vortex-Downloader')
          dst = '${{ matrix.asset_name }}'
          if os.path.exists(src):
              shutil.move(src, dst)
              print(f"Successfully moved {src} to {dst}")
          else:
              raise FileNotFoundError(f"Source file {src} not found in dist. Files in dist: {os.listdir('dist') if os.path.exists('dist') else 'dist directory missing'}")

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  create-release:
    needs: build-desktop-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Vortex-Downloader-Windows-x64.exe/Vortex-Downloader-Windows-x64.exe
            release-assets/Vortex-Downloader-macOS-x64/Vortex-Downloader-macOS-x64
            release-assets/Vortex-Downloader-Linux-x64/Vortex-Downloader-Linux-x64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
